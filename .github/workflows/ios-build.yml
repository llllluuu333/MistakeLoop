name: iOS Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (simulator, no signing)
        run: |
          xcodebuild \
            -project MistakeLoop.xcodeproj \
            -scheme MistakeLoop \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  run-on-simulator:
    runs-on: macos-15
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build for simulator
        run: |
          xcodebuild \
            -project MistakeLoop.xcodeproj \
            -scheme MistakeLoop \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Prepare simulator
        run: |
          set -e
          DEVICE_NAME="iPhone 16"
          if ! xcrun simctl list devices available | grep -q "$DEVICE_NAME"; then
            DEVTYPE=$(xcrun simctl list devicetypes | awk '/iPhone 16 \(/ {print $NF}' | tr -d '()' | head -1)
            RUNTIME=$(xcrun simctl list runtimes available | grep -o 'com.apple.CoreSimulator.SimRuntime.iOS-[0-9.-]*' | head -1)
            if [ -z "$DEVTYPE" ] || [ -z "$RUNTIME" ]; then
              echo "No device type or runtime available:"
              xcrun simctl list devicetypes
              xcrun simctl list runtimes
              exit 1
            fi
            echo "Creating $DEVICE_NAME with $DEVTYPE / $RUNTIME"
            xcrun simctl create "$DEVICE_NAME" "$DEVTYPE" "$RUNTIME"
          fi
          xcrun simctl boot "$DEVICE_NAME" || true
          xcrun simctl bootstatus "iPhone 16" -b

      - name: Install and launch app
        run: |
          APP_PATH=$(find DerivedData/Build/Products -name "MistakeLoop.app" -type d | head -1)
          echo "App path: $APP_PATH"
          xcrun simctl install booted "$APP_PATH"
          xcrun simctl launch booted com.zzc.mistakeloop
          sleep 8

      - name: Verify app is running
        run: |
          xcrun simctl spawn booted launchctl list | grep -q "com.zzc.mistakeloop"
          echo "App is running on the simulator."

      - name: Capture screenshot
        run: |
          xcrun simctl io booted screenshot screenshot.png

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshot
          path: screenshot.png

  build-ipa:
    runs-on: macos-15
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build unsigned device app
        run: |
          xcodebuild \
            -project MistakeLoop.xcodeproj \
            -scheme MistakeLoop \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R DerivedData/Build/Products/Release-iphoneos/MistakeLoop.app Payload/
          zip -r MistakeLoop.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MistakeLoop-ipa
          path: MistakeLoop.ipa
